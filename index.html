<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="icon" href="/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="AI Chatbot"/><link rel="apple-touch-icon" href="/logo192.png"/><link rel="manifest" href="/manifest.json"/><title>Synapsis AI</title><script defer="defer" src="bundle.js"></script></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div><script>const copyBase64ToClipboard = (btn, base64) => {
      navigator.clipboard.writeText(window.atob(base64)).then(function() {
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
        }, 3000);
      }, function() {
        console.error('Unable to write to clipboard. :-(');
      });
    }</script></body></html>
